server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式问答：关闭缓冲，延长超时
    location /chat {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
    }

    location /auth/ { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /upload { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /history/ { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /sessions { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /documents { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://app:8000; proxy_set_header Host $host; }
    location /ready { proxy_pass http://app:8000; proxy_set_header Host $host; }
}
